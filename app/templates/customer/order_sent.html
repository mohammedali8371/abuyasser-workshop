<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم إرسال طلبك — {{ site.workshop_name | default('ورشة أبو ياسر الصرماح') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <meta property="og:title" content="تم إرسال طلبك — {{ site.workshop_name | default('ورشة أبو ياسر الصرماح') }}">
    <meta property="og:description" content="تم استلام طلبك بنجاح. سيتم التواصل معك عبر الوتساب في أقرب وقت.">
    <meta property="og:image" content="/og-image">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --warm: #f5a623;
            --dark: #0f0f1a;
            --card-bg: #1e1e32;
            --text-light: #e8e8e8;
            --text-muted-light: #a0a0b8;
            --border-color: #2a2a40;
        }
        * { font-family: 'Cairo', sans-serif; }
        body { background: var(--dark); color: var(--text-light); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .success-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .success-icon {
            width: 100px; height: 100px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 3rem; color: #fff;
            animation: bounceIn 0.6s ease;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-title { font-weight: 900; font-size: 1.8rem; color: #fff; margin-bottom: 0.5rem; }
        .success-desc { color: var(--text-muted-light); font-size: 1rem; line-height: 2; margin-bottom: 2rem; }
        .whatsapp-icon { font-size: 1.2rem; color: #25d366; }
        .btn-accent {
            background: var(--accent); color: #fff; border: none;
            padding: 0.8rem 2.5rem; border-radius: 50px; font-weight: 700; font-size: 1rem;
            transition: all 0.3s; text-decoration: none; display: inline-block;
        }
        .btn-accent:hover { background: #d63550; color: #fff; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233,69,96,0.4); }
        .btn-warm {
            background: var(--warm); color: var(--dark); border: none;
            padding: 0.6rem 1.8rem; border-radius: 50px; font-weight: 700;
            transition: all 0.3s; text-decoration: none; display: inline-block;
        }
        .btn-warm:hover { background: #e09520; color: var(--dark); }
        .footer-custom {
            background: var(--primary); border-top: 1px solid var(--border-color);
            padding: 2rem 0 1rem; margin-top: 3rem;
        }
        .footer-bottom {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem; margin-top: 1rem; text-align: center;
            color: var(--text-muted-light); font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div>
        <div class="success-box">
            <div class="success-icon">
                <i class="bi bi-check-lg"></i>
            </div>
            <h2 class="success-title">تم إرسال طلبك بنجاح!</h2>
            <p class="success-desc">
                <i class="bi bi-whatsapp whatsapp-icon me-1"></i>
                سيتم التواصل معك عبر الوتساب في أقرب وقت.
                <br>
                <small style="color:var(--text-muted-light);">يمكنك متابعة حالة طلبك من ملفك الشخصي</small>
            </p>
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                <a href="/customer/profile" class="btn btn-accent">
                    <i class="bi bi-person-circle me-2"></i>ملفي الشخصي
                </a>
                <a href="/customer/products" class="btn btn-warm">
                    <i class="bi bi-grid-3x3-gap me-2"></i>تصفح المنتجات
                </a>
            </div>
        </div>

        <div class="footer-custom mt-4">
            <div class="container">
                <div class="footer-bottom">
                    <p class="mb-0">&copy; 2026 {{ site.workshop_name | default('ورشة أبو ياسر الصرماح') }}. {{ site.copyright_text | default('جميع الحقوق محفوظة.') }}</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
