<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب جديد — {{ site.workshop_name | default('ورشة أبو ياسر الصرماح') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --warm: #f5a623;
            --dark: #0f0f1a;
            --card-bg: #1e1e32;
            --text-light: #e8e8e8;
            --text-muted-light: #a0a0b8;
            --border-color: #2a2a40;
        }
        * { font-family: 'Cairo', sans-serif; }
        body {
            background: var(--dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 50%, var(--secondary) 100%);
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-logo i { font-size: 3rem; color: var(--warm); }
        .auth-logo h3 { font-weight: 900; margin-top: 0.8rem; font-size: 1.4rem; }
        .auth-logo p { color: var(--text-muted-light); font-size: 0.95rem; }
        .form-control {
            background: var(--secondary) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-light) !important;
            border-radius: 14px !important;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
        }
        .form-control:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 0.2rem rgba(233,69,96,0.15) !important;
        }
        .form-control::placeholder { color: var(--text-muted-light) !important; }
        .form-label { font-weight: 600; color: var(--text-light); margin-bottom: 0.4rem; }
        .btn-accent {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.8rem;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-accent:hover {
            background: #d63550;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233,69,96,0.4);
            color: #fff;
        }
        .auth-link { color: var(--warm); text-decoration: none; font-weight: 600; }
        .auth-link:hover { color: var(--accent); text-decoration: underline; }
        .alert-custom {
            background: rgba(233,69,96,0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-logo">
            <i class="bi bi-wrench-adjustable-circle-fill"></i>
            <h3>{{ site.workshop_name | default('ورشة أبو ياسر الصرماح') }}</h3>
            <p>إنشاء حساب جديد</p>
        </div>

        {% if error %}
        <div class="alert alert-custom mb-4">
            <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/customer/register">
            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-person me-1"></i>الاسم الكامل
                </label>
                <input type="text" name="name" class="form-control" placeholder="أدخل اسمك" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-phone me-1"></i>رقم الجوال
                </label>
                <input type="tel" name="phone" class="form-control" placeholder="05XXXXXXXX" required>
            </div>
            <div class="mb-3">
                <label class="form-label">
                    <i class="bi bi-envelope me-1"></i>البريد الإلكتروني
                    <span style="color:var(--text-muted-light); font-weight:400; font-size:0.85rem;">(اختياري)</span>
                </label>
                <input type="email" name="email" class="form-control" placeholder="example@email.com">
            </div>
            <div class="mb-4">
                <label class="form-label">
                    <i class="bi bi-lock me-1"></i>كلمة المرور
                </label>
                <input type="password" name="password" class="form-control" placeholder="6 أحرف على الأقل" required minlength="6">
            </div>
            <button type="submit" class="btn btn-accent mb-3">
                <i class="bi bi-person-plus me-2"></i>إنشاء الحساب
            </button>
        </form>

        <div class="text-center">
            <span style="color:var(--text-muted-light);">لديك حساب بالفعل؟</span>
            <a href="/customer/login" class="auth-link">تسجيل الدخول</a>
        </div>
        <div class="text-center mt-3">
            <a href="/customer/" style="color:var(--text-muted-light); text-decoration:none; font-size:0.9rem;">
                <i class="bi bi-arrow-right me-1"></i>العودة للرئيسية
            </a>
        </div>
    </div>
</body>
</html>
