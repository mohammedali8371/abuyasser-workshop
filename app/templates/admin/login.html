<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - ورشة أبو ياسر الصرماح</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1d21 0%, #2c3040 50%, #1a1d21 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            padding: 2rem 1.5rem;
            text-align: center;
            color: #fff;
        }

        .login-header .brand-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 0.75rem;
        }

        .login-header h4 {
            margin: 0;
            font-weight: 700;
            font-size: 1.15rem;
        }

        .login-header small {
            opacity: 0.8;
            font-size: 0.8rem;
        }

        .login-body {
            padding: 2rem 1.5rem;
        }

        .login-body .form-label {
            font-weight: 500;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 0.4rem;
        }

        .login-body .form-control {
            border-radius: 10px;
            padding: 0.65rem 1rem;
            border: 1.5px solid #dee2e6;
            font-size: 0.9rem;
        }

        .login-body .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
        }

        .login-body .input-group-text {
            border-radius: 10px 0 0 10px;
            background: #f8f9fa;
            border-color: #dee2e6;
            color: #888;
        }

        .btn-login {
            border-radius: 10px;
            padding: 0.7rem;
            font-weight: 600;
            font-size: 0.95rem;
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            border: none;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0b5ed7, #0a58ca);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(13,110,253,0.4);
        }

        .login-footer {
            text-align: center;
            padding: 0 1.5rem 1.5rem;
            color: #aaa;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="brand-icon">
                    <i class="bi bi-gear-wide-connected"></i>
                </div>
                <h4>ورشة أبو ياسر الصرماح</h4>
                <small>لوحة التحكم</small>
            </div>
            <div class="login-body">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: 10px; font-size: 0.85rem;">
                    <i class="bi bi-exclamation-triangle-fill ms-2"></i>
                    {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}

                <form method="post" action="{{ request.path }}">
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-envelope ms-1"></i>البريد الإلكتروني
                        </label>
                        <input type="email" name="email" class="form-control" placeholder="example@email.com" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-lock ms-1"></i>كلمة المرور
                        </label>
                        <div class="input-group">
                            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                            <span class="input-group-text" onclick="togglePass()" style="cursor:pointer;">
                                <i class="bi bi-eye" id="passIcon"></i>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login w-100">
                        <i class="bi bi-box-arrow-in-left ms-2"></i>تسجيل الدخول
                    </button>
                </form>
            </div>
            <div class="login-footer">
                <i class="bi bi-shield-lock"></i> لوحة تحكم آمنة &mdash; جميع الحقوق محفوظة
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePass() {
            const inp = document.getElementById('password');
            const icon = document.getElementById('passIcon');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                inp.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }
    </script>
</body>
</html>
